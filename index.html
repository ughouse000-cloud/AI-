<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>静かな伴走者</title>

<style>
body{
  margin:0;
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f7f9f8;
  font-family:sans-serif;
}

.container{
  text-align:center;
  background:white;
  padding:40px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  width:420px;
}

.osaisen-box{
  margin-bottom:25px;
  padding:15px;
  border-radius:10px;
  background:#f3f6f4;
  font-size:13px;
  line-height:1.7;
}

.donate-btn{
  padding:10px 18px;
  border:none;
  border-radius:0px;
  background:red;
  color:white;
  cursor:pointer;
  font-size:16px;
}

.donate-btn:hover{
  opacity:0.85;
}

.paypal-note{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:12px;
  color:#666;
}

.paypal-note img{
  height:22px;
}

.omikuji{
  margin-top:6px;
  margin-bottom:14px;
  font-size:15px;
  color:#666;
}

textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  resize:none;
  font-size:14px;
}

.main-btn{
  margin-top:15px;
  padding:8px 20px;
  border:none;
  border-radius:20px;
  background:#333;
  color:white;
  cursor:pointer;
}

.main-btn:hover{
  opacity:0.8;
}

#response{
  margin-top:20px;
  font-size:14px;
  line-height:1.6;
  color:#444;
  text-align:left;
}

/* ▼追加：免責文スタイル */
.disclaimer{
  margin-top:14px;
  font-size:12px;
  line-height:1.6;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <!-- お賽銭エリア -->
  <div class="osaisen-box">
    <p>
      あなたの氣持ちを形に変えて、あんがとさんに届けましょう<br>
      コインは持ち運びが大変なので、お察しください<br>
      あなたの氣持ちを折りたたんでお賽銭をおねがいします<br>
      金額はご自由にご記入いただけます
    </p>

    <form action="https://www.paypal.com/donate" method="post" target="_blank">
      <input type="hidden" name="business" value="あなたのPayPalメール">
      <input type="hidden" name="currency_code" value="JPY">
      <button class="donate-btn">お賽銭箱</button>
    </form>

    <div class="paypal-note">
      <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg" alt="PayPal">
      <span>安全決済</span>
    </div>
  </div>

  <h2>静かな伴走者</h2>

  <div class="omikuji">
    風が少しだけ、あなた寄り。ありがとう。
  </div>

  <textarea id="message" rows="4" placeholder="いま、どんな気持ちですか？"></textarea>
  <br>
  <button class="main-btn" onclick="send()">相談する</button>

  <!-- ▼追加：免責文 -->
  <div class="disclaimer">
    この対話はAIによる参考メッセージです。<br>
    診断・治療・法律・専門判断の代わりにはなりません。<br>
    大切な決定は、ご自身と必要に応じて専門家へご相談ください。
  </div>

  <div id="response"></div>

</div>

<script>
async function send() {

  const message = document.getElementById("message").value;

  if(!message){
    alert("メッセージを入力してください");
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        omikuji: "風が少しだけ、あなた寄り。ありがとう。"
      })
    });

    const text = await res.text();
    document.getElementById("response").innerText = text;

  } catch(err) {
    document.getElementById("response").innerText =
      "通信エラーが発生しました。サーバーを確認してください。";
  }
}
</script>

</body>
</html>
