<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>静かな伴走者</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>静かな伴走者</h2>

  <!-- お賽銭 -->
  <div class="osaisen-box">
    <p>
      あなたの氣持ちを形に変えて届けましょう。<br>
      金額はご自由にお選びいただけます。
    </p>

    <form action="https://www.paypal.com/donate" method="post" target="_blank">
      <input type="hidden" name="business" value="あなたのPayPalメール">
      <input type="hidden" name="currency_code" value="JPY">
      <button class="donate-btn">お賽銭を納める</button>
    </form>

    <div class="paypal-note">
      <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg">
      <span>安全決済</span>
    </div>
  </div>

  <!-- おみくじ -->
  <div class="omikuji" id="omikujiDisplay"></div>

  <!-- 入力 -->
  <textarea id="message" rows="4" placeholder="この言葉をどう感じましたか"></textarea>
  <button class="main-btn" onclick="send()">この言葉を深掘りする</button>

  <div id="response"></div>

</div>

<script src="app.js"></script>
</body>
</html>
